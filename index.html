<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel de planos, Etapa III</title>
<style>
:root{--bg:#EEF1F5;--paper:#FFFFFF;--ink:#152647;--muted:#55627A;--line:#C5CCD8;--blue:#17407A;--red:#E3202F;--grid:rgba(23,64,122,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1626;--paper:#152036;--ink:#E6EBF2;--muted:#9AA7BC;--line:#2E3D58;--blue:#7FA6DB;--red:#F2606B;--grid:rgba(127,166,219,.06);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1626;--paper:#152036;--ink:#E6EBF2;--muted:#9AA7BC;--line:#2E3D58;--blue:#7FA6DB;--red:#F2606B;--grid:rgba(127,166,219,.06);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:20px;
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
form{background:var(--paper);border:2px solid var(--ink);border-top:6px solid var(--red);padding:24px;width:min(380px,100%)}
h1{font:700 1.4rem/1.2 "Arial Narrow",system-ui,sans-serif;margin:0 0 6px}
p{margin:0 0 16px;color:var(--muted);font-size:.92rem}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input{font:inherit;width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink)}
button{font:inherit;font-weight:600;margin-top:14px;width:100%;padding:.6rem;border:0;border-radius:4px;background:var(--blue);color:var(--paper);cursor:pointer}
button:disabled{opacity:.6}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
#err{color:var(--red);font-size:.88rem;min-height:1.3em;margin:10px 0 0}
</style>
</head>
<body>

  <input id="k" type="password" autocomplete="current-password" required autofocus>
  <button id="b" type="submit">Entrar</button>
  <div id="err" role="alert"></div>
</form>

const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pass){
  const e = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", e.encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b(C.salt), iterations:C.it, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(C.iv)}, key, b(C.ct));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
const f = document.getElementById("f"), k = document.getElementById("k"), btn = document.getElementById("b"), err = document.getElementById("err");
if (!window.crypto || !crypto.subtle){ err.textContent = "Este navegador no puede abrir el panel. Usa una versión reciente de Chrome, Edge, Firefox o Safari."; btn.disabled = true; }
let saved = null; try { saved = sessionStorage.getItem("panel-clave"); } catch(e){}
if (saved && crypto.subtle){ btn.disabled = true; btn.textContent = "Abriendo…"; open(saved).then(show).catch(() => { try{sessionStorage.removeItem("panel-clave");}catch(e){} btn.disabled=false; btn.textContent="Entrar"; }); }
f.addEventListener("submit", async ev => {
  ev.preventDefault(); err.textContent = ""; btn.disabled = true; btn.textContent = "Verificando…";
  try { const html = await open(k.value); try { sessionStorage.setItem("panel-clave", k.value); } catch(e){} show(html); }
  catch(e){ err.textContent = "Clave incorrecta. Revisa mayúsculas y espacios e inténtalo de nuevo."; btn.disabled = false; btn.textContent = "Entrar"; k.select(); }
});
})();
